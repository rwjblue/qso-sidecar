[package]
name = "qso-sidecar"
version = "0.1.0"
edition = "2024"
description = "Contest-day read-only companion dashboard for Ham2K PoLo"
license = "MIT"
repository = "https://github.com/rwjblue/qso-sidecar"
homepage = "https://github.com/rwjblue/qso-sidecar"
readme = "README.md"
keywords = ["amateur-radio", "contest", "ham-radio", "naqp"]
categories = ["command-line-utilities", "network-programming", "visualization"]
include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE",
    "docs/*.md",
    "tests/fixtures/*.txt",
]

[package.metadata.qso-sidecar]
rust-support = "current-stable"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "6.0"
futures-util = "0.3"
quick-xml = { version = "0.38", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.47", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1.17", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
strip = true
lto = "thin"
